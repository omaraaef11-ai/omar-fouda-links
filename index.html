<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="حسابات Omar Fouda على منصات التواصل الاجتماعي">
<title>Omar Fouda | Social Links</title>
<style>
:root{--gold:#d6b56d;--gold2:#a98236;--bg:#101010;--panel:#1b1b1b;--muted:#c8c2b5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#292316 0,#101010 50%,#080808 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:28px 16px}
main{width:min(100%,440px);text-align:center}.avatar{width:104px;height:104px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(145deg,#26221a,#101010);color:var(--gold);font-weight:800;font-size:30px;letter-spacing:2px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:none}
h1{font-size:30px;margin:0;color:var(--gold);letter-spacing:.3px}.sub{color:var(--muted);font-size:13px;letter-spacing:2px;margin:7px 0 24px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:0 0 22px}
.links{display:grid;gap:12px}.link{display:flex;align-items:center;gap:13px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#222,#171717);border:1px solid #735b2e;border-radius:14px;padding:15px 17px;transition:transform .15s,border-color .15s}.link:hover,.link:focus{transform:translateY(-2px);border-color:var(--gold);outline:none}.symbol{width:38px;height:38px;border-radius:11px;background:#2c261a;color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:17px}.label{font-weight:650;flex:1;text-align:right}.arrow{color:var(--gold);font-size:21px}.hint{color:#aaa18f;font-size:12px;margin-top:24px}.foot{color:#8e8678;font-size:11px;margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="avatar" id="avatar"><span id="initials">OF</span><img id="portrait" alt="الصورة الشخصية لـ Omar Fouda"></div>
  <h1>Omar Fouda</h1>
  <div class="sub">MY SOCIAL LINKS</div>
  <div class="rule"></div>
  <nav class="links" aria-label="روابط التواصل الاجتماعي">
    <a class="link" href="https://www.facebook.com/share/1Evwayc11Z/" target="_blank" rel="noopener noreferrer"><span class="symbol">f</span><span class="label">Facebook</span><span class="arrow">↗</span></a>
    <a class="link" href="https://wa.me/201012050579" target="_blank" rel="noopener noreferrer"><span class="symbol">W</span><span class="label">WhatsApp</span><span class="arrow">↗</span></a>
    <a class="link" href="https://www.instagram.com/__3omar__fouda__?cplk=bXI1a2F6dHh5ZDZs" target="_blank" rel="noopener noreferrer"><span class="symbol">◎</span><span class="label">Instagram</span><span class="arrow">↗</span></a>
    <a class="link" href="https://www.tiktok.com/@fooo0ooouda" target="_blank" rel="noopener noreferrer"><span class="symbol">♪</span><span class="label">TikTok</span><span class="arrow">↗</span></a>
  </nav>
  <div class="hint">كل حساباتك في مكان واحد</div>
  <div class="foot">BLACK & GOLD · OMAR FOUDA</div>
</main>
<script>
/* لإضافة صورتك لاحقًا: ارفع صورة باسم profile.jpg بجوار index.html، ثم أزل التعليق عن الأسطر التالية.
const img = document.getElementById('portrait');
img.src = 'profile.jpg';
img.onload = () => { img.style.display='block'; document.getElementById('initials').style.display='none'; };
*/
</script>
</body>
</html>
